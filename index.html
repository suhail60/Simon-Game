<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1> Press A key to Start</h1>
    <div class="container">
        
        <div class="top">
            <button id="green" class="box green"></button>
            <button id="red" class="box red"></button>
        </div>
         <div class="top">
            <button id="yellow" class="box yellow"></button>
            <button id="blue" class="box blue"></button>
        </div>
        <button id="btn">Start</button>
    </div>
    




    <script src="script.js"></script>
</body>
</html>
